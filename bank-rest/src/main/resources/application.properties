spring.application.name=BankRest

# --- DATABASE ---
spring.datasource.url=jdbc:mysql://localhost:3306/bank_system?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- SERVER ---
server.port=8080

# --- Jwt ---
jwt.secret=zZz!@#$%^&*()1234567890ABCDEFghijklmnop1234
jwt.expiration=86400000



# AES encryption key for CryptoService (must be 16, 24, or 32 chars)
app.crypto.aes.key=BankRestApp_AES_Key2025!
app.crypto.aes.iv=AESInitVector2025

